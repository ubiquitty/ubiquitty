<!-- The Ubiquitty mark of Resources/Icon/Ubiquitty.icon on GNOME's app icon
     template: a 128 grid, a face lit from above, and the base it stands on. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="face" x1="0" y1="10" x2="0" y2="82.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="102" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#2c2c31"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="10" x2="0" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
  </defs>
  <rect x="8" y="16" width="112" height="104" rx="12" fill="url(#base)"/>
