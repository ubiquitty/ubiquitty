<meta charset="utf-8">
<title>Proportional glyph GPU parity</title>
<body>
<pre id="verdict">running</pre>
<script type="module">
import { WebGLRenderer } from './webgl.js';
import createModule from './ubiquitty.js';

const verdict = document.getElementById('verdict');
try {
  const module = await createModule();
  module.ubiquittyFontFamily = 'monospace';
  const call = (name, result = 'number', parameters = []) => module.cwrap(`ubiquittyWeb${name}`, result, parameters);
  const canvas = document.createElement('canvas');
  document.body.appendChild(canvas);
  const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
  if (!gl) throw new Error('No WebGL2 context');
  const renderer = new WebGLRenderer(canvas);
  const viewportLimit = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  const tileWidthLimit = Math.min(viewportLimit[0], gl.getParameter(gl.MAX_RENDERBUFFER_SIZE));
  const results = [];

  for (const columns of [20, 48, 1024]) {
    for (const horizontalAlign of [0, 2, 3]) {
      call('Create', null, ['number', 'number', 'number'])(4, columns, 1);
      call('SetDrawsSizedText', null, ['number'])(1);
      call('SetDrawsProportionalText', null, ['number'])(1);
      const run = columns === 20 ? 'Wiggle jAV To' : 'WWii j '.repeat(columns === 48 ? 8 : 128) + 'W';
      const text = '\x1b[?25lmonospace stays fixed\r\n'
        + '\x1b]66;p=1:c=20;' + 'i'.repeat(48) + '\x07\r\n'
        + `\x1b[38;2;237;157;43m\x1b]66;p=1:c=${columns}:h=${horizontalAlign};${run}\x07`;
      call('Feed', null, ['string', 'number'])(text, new TextEncoder().encode(text).length);
      call('SelectAll', null)();
      const copied = call('SelectionText', 'string')();
      if (!copied.includes(run)) throw new Error(`Selection lost the ${run.length}-character source run`);
      call('ClearSelection', null)();
      for (const fontSize of [16, 20]) {
        call('SetFontSize', null, ['number'])(fontSize);
        const cpuBase = call('Render')();
        const width = call('ImageWidth')();
        const height = call('ImageHeight')();
        const cpu = module.HEAPU8.slice(cpuBase, cpuBase + width * height * 4);
        if (height > viewportLimit[1]) throw new Error(`Frame height ${height} exceeds the GPU viewport`);
        canvas.width = Math.min(width, tileWidthLimit);
        canvas.height = height;
        if (!call('BuildFrame')()) throw new Error('Frame was withheld');
        const bytes = (pointer, count, stride) => {
          const base = call(pointer)();
          return module.HEAPU8.subarray(base, base + count * stride);
        };
        const upload = (prefix, method) => {
          const pointer = call(`${prefix}AtlasPixels`)();
          const width = call(`${prefix}AtlasWidth`)();
          const height = call(`${prefix}AtlasHeight`)();
          if (pointer && width > 0 && height > 0)
            renderer[method](module.HEAPU8.subarray(pointer, pointer + width * height), width, height);
        };
        upload('', 'uploadAtlas');
        upload('Wide', 'uploadWideAtlas');
        upload('Proportional', 'uploadProportionalAtlas');
        upload('ProportionalStrip', 'uploadProportionalStripAtlas');
        upload('Ligature', 'uploadLigatureAtlas');
        const cellCount = call('CellInstanceCount')();
        const proportionalCount = call('ProportionalGlyphInstanceCount')();
        const stripCount = call('ProportionalStripInstanceCount')();
        const ligatureCount = call('LigatureGlyphInstanceCount')();
        if (proportionalCount + stripCount === 0) throw new Error('No proportional ink reached the GPU');
        const frame = {
          cellBytes: bytes('CellInstances', cellCount, 64), cellCount,
          proportionalGlyphBytes: bytes('ProportionalGlyphInstances', proportionalCount, 64),
          proportionalGlyphCount: proportionalCount,
          proportionalStripBytes: bytes('ProportionalStripInstances', stripCount, 64),
          proportionalStripCount: stripCount,
          ligatureGlyphBytes: bytes('LigatureGlyphInstances', ligatureCount, 64),
          ligatureGlyphCount: ligatureCount,
          wideGlyphBytes: null, wideGlyphCount: 0,
          colorGlyphBytes: null, colorGlyphCount: 0,
          decorationBytes: null, decorationCount: 0,
          overlayBytes: null, overlayCount: 0,
          cellWidth: call('CellWidth')(), cellHeight: call('CellHeight')(), width, height,
        };
        const differences = () => {
          let differing = 0;
          // Wide terminal frames can exceed a software GPU's viewport limit.
          // Translate the same frame into adjacent tiles without reflowing it.
          const tileSpan = Math.floor(tileWidthLimit / frame.cellWidth) * frame.cellWidth;
          for (let left = 0; left < width; left += tileSpan) {
            const tileWidth = Math.min(tileSpan, width - left);
            canvas.width = tileWidth;
            const translated = (instances, offset = left) => {
              if (!instances || left === 0) return instances;
              const copy = instances.slice();
              const floats = new Float32Array(copy.buffer, copy.byteOffset, copy.byteLength / 4);
              for (let index = 0; index < floats.length; index += 16) floats[index] -= offset;
              return copy;
            };
            renderer.drawFrame({
              ...frame, width: tileWidth,
              cellBytes: translated(frame.cellBytes, left / frame.cellWidth),
              proportionalGlyphBytes: translated(frame.proportionalGlyphBytes),
              proportionalStripBytes: translated(frame.proportionalStripBytes),
              ligatureGlyphBytes: translated(frame.ligatureGlyphBytes),
            });
            const gpu = new Uint8Array(tileWidth * height * 4);
            gl.readPixels(0, 0, tileWidth, height, gl.RGBA, gl.UNSIGNED_BYTE, gpu);
            const error = gl.getError();
            if (error !== gl.NO_ERROR) throw new Error(`GPU tile failed with ${error}`);
            for (let y = 0; y < height; ++y) {
              for (let x = 0; x < tileWidth; ++x) {
                const source = (y * width + left + x) * 4;
                const target = ((height - y - 1) * tileWidth + x) * 4;
                if ([0, 1, 2, 3].some(channel => cpu[source + channel] !== gpu[target + channel]))
                  ++differing;
              }
            }
          }
          return differing;
        };
        const differing = differences();
        const proportionalTexture = renderer.proportionalAtlasTexture;
        renderer.proportionalAtlasTexture = renderer.atlasTexture;
        const wrongPageDiffering = differences();
        renderer.proportionalAtlasTexture = proportionalTexture;
        if (proportionalCount > 0 && wrongPageDiffering <= differing) throw new Error('Wrong-page control did not detect a rendering error');
        frame.proportionalStripCount = Math.max(0, stripCount - 1);
        const missingTileDiffering = differences();
        frame.proportionalStripCount = stripCount;
        if (stripCount > 0 && missingTileDiffering <= differing) throw new Error(`Missing-tile control did not detect a rendering error at ${columns}/${horizontalAlign}/${fontSize}: strips=${stripCount}, baseline=${differing}, control=${missingTileDiffering}`);
        results.push({ columns, horizontalAlign, fontSize, proportionalCount, stripCount, ligatureCount, differing, wrongPageDiffering, missingTileDiffering });
      }
    }
  }
  for (const columns of [20, 48, 1024]) {
    for (const fontSize of [16, 20]) {
      const population = results.filter(result => result.columns === columns && result.fontSize === fontSize);
      if (!population.some(result => result.proportionalCount >= 48)) throw new Error(`No dedicated glyph coverage at ${columns}/${fontSize}`);
      if (!population.some(result => result.stripCount >= (columns > 32 ? 2 : 1))) throw new Error(`No strip coverage at ${columns}/${fontSize}`);
    }
  }
  verdict.textContent = JSON.stringify({ verdict: results.length === 18 && results.every(result => result.differing === 0) ? 'MATCH' : 'DIFFER', results });
} catch (error) {
  verdict.textContent = `ERROR ${String(error).replaceAll('\n', ' ')}`;
}
</script>
