# The type specimen plates: the house light theme on JetBrains Mono, with the
# Nerd Font symbol fallback the symbol-fallback cases use. Noir Clair rather
# than a cream ground: its near-white sits under every accent at the contrast
# the theme was solved for, so a swatch row shows all sixteen slots and a
# coloured rule reads as its hue, not as a tint of the paper.
[font]
family = "JetBrains Mono"
size = 13
fallback = "Symbols Nerd Font Mono"
symbol_fallback = "Symbols Nerd Font Mono"

[appearance]
theme = "Noir Clair"
