name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or use case?
      description: What are you trying to do that Ubiquitty doesn't (or doesn't do well) today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. If it maps to a terminal spec (VT/OSC/SGR, kitty/iTerm2 protocol, etc.), link it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / prior art
      description: How do other terminals handle this? Anything you've tried?
