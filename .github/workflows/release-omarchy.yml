name: Omarchy release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated product tag to package without GTK chrome
        required: true
        type: string
permissions:
  contents: read
  checks: read
  packages: read
concurrency:
  group: omarchy-release-${{ inputs.tag }}
  cancel-in-progress: false
env:
  PRODUCT_TAG: ${{ inputs.tag }}
  UBIQUITTY_SOURCE_ROOT: ${{ github.workspace }}/product
  PYTHONDONTWRITEBYTECODE: '1'
defaults:
  run:
    working-directory: product
jobs:
  native:
    name: Chromeless Omarchy (${{ matrix.architecture }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          tag: ${{ env.PRODUCT_TAG }}
      - name: Resolve the pinned Omarchy builder
        id: builder
        working-directory: ${{ github.workspace }}
        run: echo "revision=$(git rev-parse HEAD:Integrations/omarchy)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ubiquitty/omarchy
          ref: ${{ steps.builder.outputs.revision }}
          path: omarchy-builder
          fetch-depth: 0
          persist-credentials: false
      - name: Test the canonical Omarchy build and integration helpers
        working-directory: ${{ github.workspace }}/omarchy-builder
        run: python3 -m unittest discover -s tests -v
      - name: Restore native compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: omarchy-ccache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            release-ccache-${{ runner.os }}-${{ runner.arch }}-appimage-${{ matrix.architecture }}-
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-linux-frontend-
      - name: Free unused hosted SDK space
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
      # Both native trainers report the OCI index as Docker's image identity.
      # Pull through containerd on both runners to preserve that identity.
      - name: Match the PGO training image store
        env:
          CONTAINERD_IMAGE_STORE: "true"
        run: |
          sudo --preserve-env=CONTAINERD_IMAGE_STORE python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          configuration = json.loads(path.read_text()) if path.exists() else {}
          configuration.setdefault('features', {})['containerd-snapshotter'] = os.environ['CONTAINERD_IMAGE_STORE'] == 'true'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(configuration))
          PYTHON
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}'
      - name: Authenticate the PGO image pull
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Load the immutable PGO training image
        env:
          RELEASE_PGO_IMAGE: ${{ matrix.architecture == 'x86_64' && vars.PGO_LINUX_X86_64_IMAGE || vars.PGO_LINUX_ARM64_IMAGE }}
        run: python3 "$UBQ_RELEASE_CI" image --architecture "${{ matrix.architecture }}" --reference "$RELEASE_PGO_IMAGE"

      - name: Build and verify the chromeless native package
        env:
          UBQ_CI_LINUX_IMAGE: 'true'
          UBQ_BUILD_JOBS: '4'
          UBQ_RELEASE_GH_TOKEN: ${{ github.token }}
          UBQ_PRODUCT_TAG: ${{ env.PRODUCT_TAG }}
          UBQ_OMARCHY_ARCH: ${{ matrix.architecture }}
          UBQ_OMARCHY_RELEASE: ${{ github.workspace }}/Scripts/release_omarchy.py
          UBQ_OMARCHY_BUILDER: ${{ github.workspace }}/omarchy-builder
        run: |
          container_build="$(cat <<'UBQ_OMARCHY_BUILD'
          export PATH="${UBQ_PGO_LLVM:+$UBQ_PGO_LLVM:}$PATH" CC=clang CXX=clang++ GH_TOKEN="$UBQ_RELEASE_GH_TOKEN"
          python3 "$UBQ_OMARCHY_RELEASE" build --source-root "$PWD" --builder "$UBQ_OMARCHY_BUILDER" --build-root "$UBQ_BUILD_ROOT" --output "$UBQ_BUILD_ROOT/omarchy-dist" --tag "$UBQ_PRODUCT_TAG" --architecture "$UBQ_OMARCHY_ARCH"
          UBQ_OMARCHY_BUILD
          )"
          ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh bash -c "$container_build"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omarchy-native-${{ matrix.architecture }}
          path: ${{ env.UBQ_BUILD_ROOT }}/omarchy-dist/*
          if-no-files-found: error
      - name: Stop remaining owned CI containers
        if: always()
        run: ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" --cleanup-containers

  collect:
    name: Verify both chromeless Omarchy packages
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          tag: ${{ env.PRODUCT_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: omarchy-native-*
          path: ${{ runner.temp }}/omarchy-inputs
      - name: Verify complete native package provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          builder="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD:Integrations/omarchy)"
          python3 "$GITHUB_WORKSPACE/Scripts/release_omarchy.py" collect --source-root "$PWD" --builder "$builder" --inputs "$RUNNER_TEMP/omarchy-inputs" --output "$RUNNER_TEMP/omarchy-release" --tag "$PRODUCT_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omarchy-release-preparation
          path: ${{ runner.temp }}/omarchy-release/*
          if-no-files-found: error
