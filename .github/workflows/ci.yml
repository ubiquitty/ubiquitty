name: CI

# The full matrix, on every pull request and every push to main: the batteries
# Core's ci_batteries.py defines, run over the app with the Kit and the Core it
# pins, and the push gates Scripts/pre-push-gates.sh runs that the batteries do
# not (the same families, through the same runner, with every diff-chosen gate
# selected and every stand-down a failure). The pre-push hook runs the part of
# this a push can afford; a pull request merges only with this green.
#
# One required check, `CI`, needs every other job, so the list of jobs can
# change without a change to the repository's branch protection.
#
# A newer push to a pull request supersedes its run. main is exempt: every merge
# there is a commit that nothing else will re-verify, and a cancelled run would
# leave it without a verdict. Scheduled sweeps have a group of their own, so a
# busy landing queue cannot continually cancel the tip's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'sweep' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_dispatch:
    inputs:
      ui_scenarios:
        description: "Also run the macOS UI scenarios on the hosted runner"
        type: boolean
        default: false
  # Once a day: a sweep stands down when main's tip already has a verdict.
  schedule:
    - cron: "13 5 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# Jobs use GitHub-hosted runners. Repository settings must keep self-hosted
# runners unregistered: pull requests can supply their own workflow files.
env:
  UBQ_CI_ANNOTATE: "1"

# Every job reads the checkout and nothing else. The repository's default token
# is read-only too, but a job's grant is stated here rather than left to a
# setting this file cannot show. Preflight adds the two reads ci_reach.py needs.
permissions:
  contents: read

jobs:
  preflight:
    # Draft events still enter workflow concurrency to cancel prior ready runs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: CI preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      builds: ${{ steps.reach.outputs.builds }}
      linux: ${{ steps.reach.outputs.linux }}
      apple: ${{ steps.reach.outputs.apple }}
      cmake: ${{ steps.reach.outputs.cmake }}
      code: ${{ steps.reach.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Determine change reach and completed checkpoints
        id: reach
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci_reach.py --source-root "$GITHUB_WORKSPACE"
      # A sweep that stands down runs no gate, so it concludes as the run that
      # judged this tip did: a failed tip stays red, and the next sweep reads
      # this run's failure as the same verdict rather than its skips as a pass.
      - name: Keep this tip's failed verdict
        if: steps.reach.outputs.standing == 'failure'
        run: |
          echo "::error title=CI reach::An earlier run of this commit failed a gate; this sweep did not run it again"
          exit 1
      # A hosted runner starts with no images, and this one takes minutes to
      # build. It is kept in the Actions cache under its recipe's digest, so a
      # run builds it only when the recipe changed, and a sweep that stands down
      # for this tip (preflight=false) neither restores nor builds it.
      - name: Name the CI image
        id: image
        if: runner.environment == 'github-hosted' && steps.reach.outputs.preflight != 'false'
        run: echo "digest=$(./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" --recipe-digest)" >> "$GITHUB_OUTPUT"
      - name: Restore the CI image
        id: restore-image
        if: steps.image.outputs.digest != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ steps.image.outputs.digest }}
      - name: Run the fail-fast preflight
        if: steps.reach.outputs.preflight != 'false'
        env:
          UBQ_CI_IMAGE_ARCHIVE: ${{ runner.temp }}/ubq-ci-linux-image.tar
          UBQ_CI_LINUX_IMAGE: ${{ runner.environment == 'github-hosted' }}
        run: ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci_batteries.py run preflight --source-root "$GITHUB_WORKSPACE"
      # The commit rules and the app's style gates the push hook runs and the
      # preflight battery does not, through the hook's own runner. Strict: a
      # gate that stands down fails.
      - name: Push gates (commit rules)
        if: steps.reach.outputs.preflight != 'false'
        env:
          UBQ_CI_LINUX_IMAGE: ${{ runner.environment == 'github-hosted' }}
          UBIQUITTY_PREPUSH: families
          UBQ_PREPUSH_FAMILIES: gate_commit_rules gate_style_app
          UBQ_PREPUSH_SELECT: all
          UBQ_PREPUSH_STRICT: "1"
          UBIQUITTY_PREPUSH_CACHE: "off"
        run: ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" ./Scripts/pre-push-gates.sh
      # Saved whether or not a gate failed: the image was built either way. A
      # run that stopped before building it has no archive, and the save
      # reports that without failing the job.
      - name: Save the CI image
        if: always() && steps.image.outputs.digest != '' && steps.restore-image.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ steps.image.outputs.digest }}
      - name: Report completed, failed, and unexecuted preflight stages
        if: always() && steps.reach.outputs.preflight != 'false'
        run: python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci_batteries.py report preflight --source-root "$GITHUB_WORKSPACE"
      # A failed stage's log, in full, in the job log. CI uploads no artifacts: the
      # job log is where a failure is read.
      - name: Print the failed stage logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/ubiquitty-ci/preflight"/*.log; do
            [ -f "$log" ] || continue
            echo "::group::${log##*/}"
            cat "$log"
            echo "::endgroup::"
          done
  linux:
    # Four groups of the Linux battery on four runners, so the battery's wall
    # time is its longest group rather than their sum. ci_reach.py reads the
    # battery as complete only when every group is.
    name: Linux battery (${{ matrix.group }})
    needs: preflight
    if: needs.preflight.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      # A failure in one group does not stop the others: the author reads every
      # group's verdict from one push.
      fail-fast: false
      matrix:
        include:
          - group: gcc
            stages: --only setup --only quic --only host-tests --only portable-build --only portable-snapshots --only host-glibc --only agent-smokes --only host-musl
            families: ""
          # The Linux pgo stage is not hosted (Stage.hosted): its profile is
          # stamped with the image it was trained in, which this runner never
          # has.
          - group: clang
            stages: --only setup --only quic --only fuzz --only sanitizers
            families: ""
          # Linux-native snapshots are not hosted (Stage.hosted): their goldens
          # take fallback glyphs from the system fonts of the Linux host that
          # drew them, which this runner's image does not carry.
          - group: frontend
            stages: --only setup --only frontend-tools --only quic --only linux-build --only linux-smokes --only linux-determinism
            families: ""
          - group: wasm
            stages: --only setup --only wasm-tools --only wasm-smoke --only web-build --only web-snapshots
            families: core_gate_wasm_oracle
    env:
      UBQ_CI_CODE: ${{ needs.preflight.outputs.code }}
      UBQ_CI_CMAKE: ${{ needs.preflight.outputs.cmake }}
      UBQ_CI_PREFLIGHT_COMPLETE: "1"
      STAGES: ${{ matrix.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      # The Docker image, compiler cache, and test executables share the
      # hosted runner's disk. These preinstalled SDKs are not dependencies of
      # any battery; free their space before restoring the build caches.
      - name: Free unused hosted SDK space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Cache QUIC dependencies
        if: needs.preflight.outputs.code == 'true' && matrix.group != 'wasm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: |
            ${{ runner.workspace }}/build-gcc/quic-deps/lib
            ${{ runner.workspace }}/build-gcc/quic-deps/include
          key: quic-deps-${{ runner.os }}-${{ hashFiles('Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/fetch-quic-deps.sh') }}
      # A hosted runner starts with an empty compiler cache, and the host test
      # build then runs close to ubq_build's 900 s budget. The cache sits beside
      # the checkout, where
      # Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh points
      # CCACHE_DIR, and is saved even when the battery fails, so the next run
      # starts warm. One per group: the groups compile with different compilers
      # and flags, and a shared one would evict across them.
      - name: Restore the compiler cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-linux-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-${{ matrix.group }}-
      # The image preflight restored or built, under the same key.
      - name: Name the CI image
        id: image
        if: runner.environment == 'github-hosted'
        run: echo "digest=$(./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" --recipe-digest)" >> "$GITHUB_OUTPUT"
      - name: Restore the CI image
        id: restore-image
        if: steps.image.outputs.digest != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ steps.image.outputs.digest }}
      - name: Run the fail-fast Linux battery
        id: battery
        env:
          UBQ_CI_IMAGE_ARCHIVE: ${{ runner.temp }}/ubq-ci-linux-image.tar
          UBQ_CI_LINUX_IMAGE: ${{ runner.environment == 'github-hosted' }}
        run: |
          # STAGES is this group's list of `--only <stage>` words, split on purpose.
          # shellcheck disable=SC2086
          ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci_batteries.py run linux --source-root "$GITHUB_WORKSPACE" $STAGES
      # The hook's families that only this group's toolchain runs: the wasm
      # arm's oracle, with the emscripten the battery installed.
      - name: Push gates (${{ matrix.group }})
        if: matrix.families != ''
        env:
          UBQ_CI_LINUX_IMAGE: ${{ runner.environment == 'github-hosted' }}
          UBIQUITTY_PREPUSH: families
          UBQ_PREPUSH_FAMILIES: ${{ matrix.families }}
          UBQ_PREPUSH_SELECT: all
          UBQ_PREPUSH_STRICT: "1"
          UBIQUITTY_PREPUSH_CACHE: "off"
          UBQ_BUILD_ROOT: ${{ runner.workspace }}/build-gates
        run: |
          ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$GITHUB_WORKSPACE" bash -c '
            emsdk="$RUNNER_TOOL_CACHE/emsdk-6.0.9/emsdk_env.sh"
            if [ -f "$emsdk" ]; then . "$emsdk" >/dev/null; fi
            exec ./Scripts/pre-push-gates.sh'
      - name: Save the CI image
        if: always() && steps.image.outputs.digest != '' && steps.restore-image.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.temp }}/ubq-ci-linux-image.tar
          key: ci-linux-image-${{ steps.image.outputs.digest }}
      # The history reader requires every group's marker. A goldens-only
      # battery, or a failed/cancelled partial run, is not a full checkpoint.
      - name: Full Linux battery completed
        if: steps.battery.outputs.full_code == 'true'
        run: echo "Every enabled Linux code stage of this group reached its verdict"
      - name: Report completed, failed, and unexecuted Linux stages
        if: always()
        run: |
          # shellcheck disable=SC2086
          python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci_batteries.py report linux --source-root "$GITHUB_WORKSPACE" $STAGES
      # A failed stage's log, in full, in the job log. CI uploads no artifacts: the
      # job log is where a failure is read.
      - name: Print the failed stage logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/ubiquitty-ci/linux"/*.log; do
            [ -f "$log" ] || continue
            echo "::group::${log##*/}"
            cat "$log"
            echo "::endgroup::"
          done
      - name: Save the compiler cache
        if: always() && runner.environment == 'github-hosted'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-linux-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
  apple:
    # Three groups of the Apple battery on three runners: the macOS app and its
    # gates, the whole suite, and the iOS simulator arm. ci_reach.py reads the
    # battery as complete only when every group is.
    name: Apple battery (${{ matrix.group }})
    needs: preflight
    if: needs.preflight.outputs.apple == 'true'
    # GitHub's image with the Xcode this tree builds with (27.1, as the
    # maintainers' Macs have it); see .github/actionlint.yml.
    runs-on: xcode-27
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: macos
            stages: --only setup --only swift-format --only xcode --only quic --only tidy --only macos-build --only macos-smokes --only ui-scenarios --only pgo --only core-frames --only portable-build --only swift-renderer --only forks --only snapshots
            families: kit_gate_apple core_gate_pgo_drift gate_esctest
          - group: tests
            stages: --only setup --only quic --only host-tests
            families: core_gate_host_builds core_gate_forks core_gate_style_checks
          - group: ios
            stages: --only setup --only quic --only ios-build --only ios-smokes --only ios-sync --only ios-protected-file --only ios-ui
            families: ""
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      UBQ_CI_CODE: ${{ needs.preflight.outputs.code }}
      UBQ_CI_CMAKE: ${{ needs.preflight.outputs.cmake }}
      UBQ_CI_PREFLIGHT_COMPLETE: "1"
      # The UI scenarios run on the maintainers' Macs for every batch, and
      # here only when a run by hand asks for them.
      UBQ_CI_UI_SCENARIOS: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_scenarios && 'true' || 'false' }}
      STAGES: ${{ matrix.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Selected Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
      # A job's env cannot read the runner context, so this step sets the cache
      # beside the checkout from the runner's own variables; every later step
      # reads it.
      - name: Compiler cache
        run: |
          command -v ccache >/dev/null 2>&1 || brew install ccache
          {
            echo "CCACHE_DIR=$RUNNER_WORKSPACE/ccache"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-apple-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-apple-${{ matrix.group }}-
      - name: Run the fail-fast Apple battery
        id: battery
        run: |
          # STAGES is this group's list of `--only <stage>` words, split on purpose.
          # shellcheck disable=SC2086
          python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci_batteries.py run apple --source-root "$GITHUB_WORKSPACE" $STAGES
      # What the push hook runs on a Mac and this group's stages do not: the
      # Kit's Swift renderer from clean and its framework consumer, the PGO
      # bounds against the portable profile, and esctest2 against the built app;
      # the host's builds, the symbol-fork check over them, and the style checks
      # whose self-tests read the built test objects.
      - name: Push gates (${{ matrix.group }})
        if: matrix.families != ''
        env:
          UBIQUITTY_PREPUSH: families
          UBQ_PREPUSH_FAMILIES: ${{ matrix.families }}
          UBQ_PREPUSH_SELECT: all
          UBQ_PREPUSH_STRICT: "1"
          UBIQUITTY_PREPUSH_CACHE: "off"
        run: ./Scripts/pre-push-gates.sh
      - name: Full Apple battery completed
        if: steps.battery.outputs.full_code == 'true'
        run: echo "Every enabled Apple code stage of this group reached its verdict"
      - name: Report completed, failed, and unexecuted Apple stages
        if: always()
        run: |
          # shellcheck disable=SC2086
          python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci_batteries.py report apple --source-root "$GITHUB_WORKSPACE" $STAGES
      # A failed stage's log, in full, in the job log. CI uploads no artifacts: the
      # job log is where a failure is read.
      - name: Print the failed stage logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/ubiquitty-ci/apple"/*.log; do
            [ -f "$log" ] || continue
            echo "::group::${log##*/}"
            cat "$log"
            echo "::endgroup::"
          done
      - name: Tools the Apple battery ran with
        if: always()
        run: |
          sw_vers
          xcodebuild -version
          tmux -V || echo "tmux: not installed"
          chafa --version | head -1 || echo "chafa: not installed"
          go version || echo "go: not installed"
          ninja --version || echo "ninja: not installed"
      - name: Save the compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-apple-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
  host-linux-arm64:
    name: Linux host build (glibc-arm64)
    needs: preflight
    # Not run on hosted runners, for the reason the Linux battery states.
    if: ${{ false }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build (glibc)
        # This image's `g++` is GCC 13, below the floor Core's
        # Scripts/cmake/UbiquittyToolchain.cmake refuses, so GCC 14 is installed
        # and named.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14 pkg-config
          CC=gcc-14 CXX=g++-14 ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/build-host.sh --release

  coverage:
    name: Coverage floor
    needs: preflight
    # A coverage job that fails independently of the pull request cannot decide
    # whether that change lands. Re-enable this job once its instrumentation and
    # floor are reliable; the coverage tooling remains available outside CI.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    # The build root sits beside the checkout rather than under the home
    # directory's DerivedData. What ccache hashes is the path from the build
    # directory to each source, which the base_dir setting rewrites relative:
    # beside the checkout that path is the same in every job, so a compiler
    # cache restored from another run can hit, and under DerivedData it runs
    # through the runner's own directory name and cannot. Measured: with the
    # DerivedData root, the same file compiled from two runner-shaped paths
    # missed both times; beside the checkout it hit.
    #
    # CCACHE_STATSLOG is this job's own tally, printed by the last step, so a
    # reader of one log knows what the cache did for that job.
    timeout-minutes: 90
    # Blocking. Runs the instrumented suite and enforces the per-file floors on
    # every PR; the floors themselves live in
    # Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/check-coverage-floor.sh,
    # which is the only place they are worth reading. A job of its own:
    # coverage instrumentation perturbs timing far beyond the noise floor, so
    # it must never share a runner with benchmark measurements.
    steps:
      # A job's env cannot read the runner context, so the first step sets
      # the two from the runner's own variables; every later step reads them.
      - name: Build beside the checkout
        run: |
          echo "UBQ_BUILD_ROOT=$RUNNER_WORKSPACE/build" >> "$GITHUB_ENV"
          echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow reaches the repository over the network
          # after checkout, so the token does not belong in .git/config.
          persist-credentials: false
          submodules: recursive
          # Full history so the changed-line gate can diff against the PR base.
          fetch-depth: 0
      # A fresh clone has no hooks, and run-tests.sh reports on them before it
      # runs anything, so without this the suite opens with a failed verdict
      # about the clone rather than about the change.
      - name: Install hooks
        run: ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/install-hooks.sh
      - name: Install clang + llvm
        # ci-toolchain.sh skips the install when the resolved version of each
        # tool and the digest of every workflow file match the stamp the last
        # install recorded on this runner. A GitHub-hosted image starts every
        # job without a stamp, so here the check costs one version probe and
        # the install runs; a compiler that changed under the job, and a
        # package list edited here, reach the install either way.
        #
        # On ubuntu-24.04 the distribution's clang and llvm are 18, below the
        # floor in Core's Scripts/cmake/ToolchainFloor.cmake, so that image needs
        # clang-19 and llvm-19, with /usr/lib/llvm-19/bin first on PATH so the
        # llvm-profdata and llvm-cov run-coverage.sh calls match the compiler.
        run: |
          if ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-toolchain.sh check clang-llvm clang llvm-profdata llvm-cov; then
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang llvm
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y clang llvm
          elif command -v pacman >/dev/null 2>&1; then
            sudo pacman -Sy --noconfirm clang llvm
          fi
          ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-toolchain.sh record clang-llvm clang llvm-profdata llvm-cov
      # The instrumented suite runs the shell stanzas, and each configures a host
      # build that wants the QUIC stack. Without it every one of them reports
      # BUILD-BROKEN at the fetch-quic-deps guard, ubiquitty_ensure_quic_deps in
      # Core's Scripts/cmake/UbiquittyToolchain.cmake — the tests job builds
      # these and this one did not.
      - name: Cache QUIC deps (ngtcp2 + AWS-LC)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: |
            ${{ env.UBQ_BUILD_ROOT }}/quic-deps/lib
            ${{ env.UBQ_BUILD_ROOT }}/quic-deps/include
          key: quic-deps-${{ runner.os }}-${{ hashFiles('Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/fetch-quic-deps.sh') }}
      - name: Build QUIC deps (cache miss builds ngtcp2 + AWS-LC; cache hit skips)
        run: ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ensure-quic-deps.sh
      - name: Coverage-gate tool self-test
        run: bash ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/test-coverage-changed-lines.sh
      - name: Instrumented suite + coverage floor
        env:
          CC: clang
          CXX: clang++
        run: |
          HTML=1 ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/run-coverage.sh --source-root "$GITHUB_WORKSPACE"
          ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/check-coverage-floor.sh --source-root "$GITHUB_WORKSPACE"
      - name: Changed-line coverage gate
        # Needs a base to diff against, so pull-request only. The lcov lives
        # under the build root, outside the checkout, where run-coverage.sh
        # writes it.
        if: github.event_name == 'pull_request'
        run: |
          python3 ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/coverage-changed-lines.py \
            --lcov "$UBQ_BUILD_ROOT/BuildHostTests/coverage/coverage.lcov" \
            --root "$GITHUB_WORKSPACE" \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --json coverage-changed-lines.json
      - name: "ccache: this job's hit rate"
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1 && [ -f "$CCACHE_STATSLOG" ]; then
            ccache --show-log-stats
          else
            echo "no ccache tally for this job"
          fi

  # The one check branch protection names. It passes when every job that had
  # to run passed: preflight always, and the rest unless change reach or a
  # parked condition left them out. A job that failed, was cancelled, or never
  # started because one it needs failed is a failure here.
  ci:
    name: CI
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [preflight, linux, apple, host-linux-arm64, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job that had to run passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = []
          for job, result in sorted(needs.items()):
              conclusion = result["result"]
              print(f"{job}: {conclusion}")
              if job == "preflight" and conclusion != "success":
                  failed.append(job)
              elif conclusion not in ("success", "skipped"):
                  failed.append(job)
          if failed:
              print(f"::error title=CI::did not pass: {', '.join(failed)}")
              sys.exit(1)
          EOF
