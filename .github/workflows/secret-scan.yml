name: Secret scan

# Keeps the public repo free of committed secrets (keys, tokens, credentials).
# The tree + full history scan clean at adoption; this job blocks any future
# regression on a PR and sweeps weekly for anything landed between gates.

# One run per ref. A push to a pull request cancels the run for the head it
# replaces, so a branch pushed five times scans one commit rather than spending
# runner time and Actions minutes on four superseded ones nobody is waiting on.
#
# main is exempt. Every merge there is a distinct commit that nothing else will
# re-verify, and cancelling one to start the next would leave the tree with a
# verdict for a commit that is no longer the tip -- which is the case CI exists
# for. Only branch runs, whose next push is a better test of the same intent,
# are superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: gitleaks
    # A GitHub-hosted runner, like every job in this repository; see "Runners
    # and fork pull requests" in Docs/building-and-releasing.md. gitleaks is a
    # static binary, so it is unpacked under the runner's temp dir and nothing
    # is installed on the machine.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here reaches the repository after checkout, so the token
          # does not belong in .git/config.
          persist-credentials: false
          fetch-depth: 0 # full history, so a secret in any commit is caught — not just the PR diff
      # The archive is checked against the digest gitleaks published for it, as
      # check-workflows.sh pins actionlint, so a replaced release asset fails
      # here instead of running as the scanner.
      - name: Fetch gitleaks
        run: |
          version=8.30.1
          digest=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "$digest  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Verify scanner exceptions retain credential detection
        run: |
          PATH="$RUNNER_TEMP/gitleaks:$PATH" python3 Tests/Tools/test_gitleaks_config.py
      - name: Scan working tree + history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --config .gitleaks.toml --redact --verbose
