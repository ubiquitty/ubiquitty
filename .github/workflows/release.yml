name: Release

# An annotated App tag binds the exact tagged Core and Kit pins. Build the
# supported downloads in parallel and preserve verified unsigned artifacts.
# Signing and GitHub/R2 publication run on the maintainer's Mac.
# See Docs/release-ci.md for local publication and immutable PGO images.
#
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated product tag to retry
        required: true
        type: string

# CI only prepares artifacts. Signing identities and publication credentials
# stay on the maintainer's Mac; every job has read-only repository access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  UBIQUITTY_SOURCE_ROOT: ${{ github.workspace }}/product
  GH_REPO: ubiquitty/ubiquitty
  PRODUCT_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

defaults:
  run:
    working-directory: product

jobs:
  preflight:
    name: Validate release cut
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          tag: ${{ env.PRODUCT_TAG }}
      - name: Require matching tags, clean pins, versions and green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$UBQ_RELEASE_CI" validate --tag "$PRODUCT_TAG"

  host-linux:
    needs: preflight
    timeout-minutes: 30
    name: Linux host (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          tag: ${{ env.PRODUCT_TAG }}
      - name: Resolve the build root
        run: echo "UBQ_BUILD_ROOT=$(python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/build_root.py .)" >> "$GITHUB_ENV"
      - name: Cache static-host dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ env.UBQ_BUILD_ROOT }}/host-cross/deps
          key: release-host-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('product/**/fetch-quic-deps.sh', 'product/**/linux-images.txt') }}
      - name: Build static-musl ubiquitty-host
        run: ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/build-host-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubiquitty-host-linux-${{ matrix.arch }}
          path: ${{ env.UBQ_BUILD_ROOT }}/host-cross/ubiquitty-host-linux-${{ matrix.arch }}*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Prepare macOS app
    needs: [preflight, host-linux]
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          tag: ${{ env.PRODUCT_TAG }}
      - name: QUIC dependency cache identity
        id: quic
        run: echo "quic_toolchain=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore QUIC dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: |
            ${{ env.UBQ_BUILD_ROOT }}/quic-deps
            !${{ env.UBQ_BUILD_ROOT }}/quic-deps/**/src/*/build
          key: quic-apple-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.quic.outputs.quic_toolchain }}-${{ hashFiles('product/**/Scripts/fetch-quic-deps.sh', 'product/**/Scripts/macos-deployment-target.txt', 'product/**/Scripts/cmake/UbiquittyPreProject.cmake') }}-release-macos-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: quic-apple-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.quic.outputs.quic_toolchain }}-${{ hashFiles('product/**/Scripts/fetch-quic-deps.sh', 'product/**/Scripts/macos-deployment-target.txt', 'product/**/Scripts/cmake/UbiquittyPreProject.cmake') }}-release-macos-
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: release-ccache-${{ runner.os }}-${{ runner.arch }}-macos-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-ccache-${{ runner.os }}-${{ runner.arch }}-macos-
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-apple-macos-
      - name: Fetch Linux host binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ubiquitty-host-linux-*
          path: ${{ runner.temp }}/host-cross-artifacts
      - name: Collect Linux host binaries
        run: |
          mkdir -p "$UBQ_BUILD_ROOT/host-cross"
          set -euo pipefail
          core="$UBIQUITTY_SOURCE_ROOT/Libraries/ubiquitty-kit/Libraries/ubiquitty-core"
          image="$(sed -n 's/^host=//p' "$core/Scripts/linux-images.txt")"
          for arch in x86_64 arm64; do
            for suffix in '' .json; do
              leaf="ubiquitty-host-linux-$arch$suffix"
              find "$RUNNER_TEMP/host-cross-artifacts" -type f -name "$leaf" -exec cp {} "$UBQ_BUILD_ROOT/host-cross/" \;
              test -s "$UBQ_BUILD_ROOT/host-cross/$leaf"
            done
            key="$(python3 "$core/Scripts/linux-host-artifact.py" key --arch "$arch" \
              --image "$image" --quic ON --version "$UBIQUITTY_BUILD_VERSION" --identity "$UBIQUITTY_BUILD_IDENTITY")"
            python3 "$core/Scripts/linux-host-artifact.py" check --arch "$arch" \
              --binary "$UBQ_BUILD_ROOT/host-cross/ubiquitty-host-linux-$arch" --key "$key"
          done
      - name: Build the release-policy app with ad-hoc signatures
        env:
          UBIQUITTY_SIGN_IDENTITY: ad-hoc
          UBIQUITTY_RELEASE_SIGNING: "ON"
          UBQ_BUILD_JOBS: 4
        run: |
          bash Scripts/fetch-sparkle.sh
          bash Scripts/build-macos.sh --release
      - name: Package the prepared Mac app
        run: |
          python3 "$GITHUB_WORKSPACE/Scripts/release_preparation.py" macos --tag "$PRODUCT_TAG" \
            --app "$UBQ_BUILD_ROOT/macos/Source/Platform/macOS/Ubiquitty.app" --directory "$UBQ_BUILD_ROOT/dist"
      - name: Save QUIC dependencies
        if: always() && env.UBQ_BUILD_ROOT != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: |
            ${{ env.UBQ_BUILD_ROOT }}/quic-deps
            !${{ env.UBQ_BUILD_ROOT }}/quic-deps/**/src/*/build
          key: quic-apple-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.quic.outputs.quic_toolchain }}-${{ hashFiles('product/**/Scripts/fetch-quic-deps.sh', 'product/**/Scripts/macos-deployment-target.txt', 'product/**/Scripts/cmake/UbiquittyPreProject.cmake') }}-release-macos-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save the compiler cache
        if: always() && env.CCACHE_DIR != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: release-ccache-${{ runner.os }}-${{ runner.arch }}-macos-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-unsigned
          path: ${{ env.UBQ_BUILD_ROOT }}/dist/*-macos-unsigned.zip
          if-no-files-found: error

  release-linux:
    timeout-minutes: 150
    name: Linux (AppImage, ${{ matrix.architecture }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          tag: ${{ env.PRODUCT_TAG }}
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: release-ccache-${{ runner.os }}-${{ runner.arch }}-appimage-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-ccache-${{ runner.os }}-${{ runner.arch }}-appimage-${{ matrix.architecture }}-
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-linux-frontend-

      # The frontend needs GTK 4.16, and this runner's Ubuntu 24.04 carries
      # 4.14, so the AppImage is built in the pinned image the Linux battery
      # builds and tests the frontend in (Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh), glslc
      # included. The build root sits in the runner workspace, which that
      # wrapper mounts at the same path, so the next step finds its output.
      - name: Point the build root into the workspace
        run: echo "UBQ_BUILD_ROOT=$RUNNER_WORKSPACE/build" >> "$GITHUB_ENV"

      - name: Free unused hosted SDK space
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
      # Both native trainers report the OCI index as Docker's image identity.
      # Pull through containerd on both runners to preserve that identity.
      - name: Match the PGO training image store
        env:
          CONTAINERD_IMAGE_STORE: "true"
        run: |
          sudo --preserve-env=CONTAINERD_IMAGE_STORE python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          configuration = json.loads(path.read_text()) if path.exists() else {}
          configuration.setdefault('features', {})['containerd-snapshotter'] = os.environ['CONTAINERD_IMAGE_STORE'] == 'true'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(configuration))
          PYTHON
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}'
      - name: Authenticate the PGO image pull
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Load the immutable PGO training image
        env:
          RELEASE_PGO_IMAGE: ${{ matrix.architecture == 'x86_64' && vars.PGO_LINUX_X86_64_IMAGE || vars.PGO_LINUX_ARM64_IMAGE }}
        run: python3 "$UBQ_RELEASE_CI" image --architecture "${{ matrix.architecture }}" --reference "$RELEASE_PGO_IMAGE"

      - name: Build runtime and updater with matching sources
        run: ./Scripts/build-appimage-support.sh

      # appimagetool runs via APPIMAGE_EXTRACT_AND_RUN
      # (set by the script), so no FUSE/libfuse2 is needed in the container.
      #
      # The binary is compiled by the clang that CI's Linux pgo stage requires
      # to apply Support/pgo/linux-x86_64-core.profdata: the LLVM the image's
      # UBQ_PGO_LLVM names, first on PATH. The image's default c++ is g++,
      # which cannot read the profile, and UBIQUITTY_PGO=REQUIRE stops the
      # configure rather than ship a plain -O3 binary. CC and CXX are set in
      # the command the image runs, because ci-linux-image.sh passes only the
      # variable prefixes it names, UBIQUITTY_ among them, into the container.
      - name: Build + package the AppImage
        env:
          UBQ_CI_LINUX_IMAGE: "true"
          UBIQUITTY_PGO: REQUIRE
          UBQ_BUILD_JOBS: 4
        run: |
          container_build="$(cat <<'UBQ_APPIMAGE_BUILD'
          PATH="${UBQ_PGO_LLVM:+$UBQ_PGO_LLVM:}$PATH" CC=clang CXX=clang++ exec ./Scripts/package-linux-appimage.sh
          UBQ_APPIMAGE_BUILD
          )"
          GITHUB_REF_NAME="$PRODUCT_TAG" ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh sh -c "$container_build"

      - name: Save the compiler cache
        if: always() && env.CCACHE_DIR != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: release-ccache-${{ runner.os }}-${{ runner.arch }}-appimage-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve the Linux publication files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-${{ matrix.architecture }}
          path: |
            ${{ env.UBQ_BUILD_ROOT }}/dist/*.AppImage
            ${{ env.UBQ_BUILD_ROOT }}/dist/*.AppImage.zsync
            ${{ env.UBQ_BUILD_ROOT }}/dist/*-support-sources.tar.xz
          if-no-files-found: error

  release-ubq:
    timeout-minutes: 30
    name: Standalone ubq (${{ matrix.arch }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          tag: ${{ env.PRODUCT_TAG }}
      - name: Resolve the build root
        run: echo "UBQ_BUILD_ROOT=$(python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/build_root.py .)" >> "$GITHUB_ENV"
      - name: Build the static command-line client
        env:
          UBQ_BUILD_JOBS: 4
        run: ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/build-agent-linux.sh ${{ matrix.arch }}
      - name: Preserve the command-line client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubq-release-${{ matrix.arch }}
          path: ${{ env.UBQ_BUILD_ROOT }}/agent-linux/ubq-linux-${{ matrix.arch }}
          if-no-files-found: error

  web:
    name: WebAssembly package
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          tag: ${{ env.PRODUCT_TAG }}
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: release-ccache-${{ runner.os }}-${{ runner.arch }}-web-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-ccache-${{ runner.os }}-${{ runner.arch }}-web-
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-linux-wasm-
      - name: Use the battery build root
        run: echo "UBQ_BUILD_ROOT=$RUNNER_WORKSPACE/build" >> "$GITHUB_ENV"
      - name: Build the browser frontend in the CI toolchain
        env:
          UBQ_CI_LINUX_IMAGE: "true"
        run: |
          ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$PWD" \
            python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci_batteries.py run linux \
            --source-root "$PWD" --only setup --only wasm-tools --only web-build
      - name: Package the complete browser distribution
        env:
          UBQ_CI_LINUX_IMAGE: "true"
        run: |
          ./Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/ci-linux-image.sh --source-root "$PWD" \
            python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/license_notices.py \
            --source "$PWD" --kit "$PWD/Libraries/ubiquitty-kit" \
            --core "$PWD/Libraries/ubiquitty-kit/Libraries/ubiquitty-core" --copy "$UBQ_BUILD_ROOT/web-dist"
          python3 "$UBQ_RELEASE_CI" web --tag "$PRODUCT_TAG" --directory "$UBQ_BUILD_ROOT/dist"
      - name: Save the compiler cache
        if: always() && env.CCACHE_DIR != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: release-ccache-${{ runner.os }}-${{ runner.arch }}-web-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-release-web
          path: ${{ env.UBQ_BUILD_ROOT }}/dist/*.tar.xz
          if-no-files-found: error

  ios:
    name: iOS development package (${{ matrix.sdk }})
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          tag: ${{ env.PRODUCT_TAG }}
      - name: QUIC dependency cache identity
        id: quic
        run: |
          echo "quic_toolchain=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "UBIQUITTY_SWIFTPM_CACHE=$RUNNER_WORKSPACE/swiftpm-cache" >> "$GITHUB_ENV"
      - name: Restore QUIC dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: |
            ${{ env.UBQ_BUILD_ROOT }}/quic-deps
            !${{ env.UBQ_BUILD_ROOT }}/quic-deps/**/src/*/build
          key: quic-apple-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.quic.outputs.quic_toolchain }}-${{ hashFiles('product/**/Scripts/fetch-quic-deps.sh', 'product/**/Scripts/macos-deployment-target.txt', 'product/**/Scripts/cmake/UbiquittyPreProject.cmake') }}-release-ios-${{ matrix.sdk }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: quic-apple-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.quic.outputs.quic_toolchain }}-${{ hashFiles('product/**/Scripts/fetch-quic-deps.sh', 'product/**/Scripts/macos-deployment-target.txt', 'product/**/Scripts/cmake/UbiquittyPreProject.cmake') }}-release-ios-${{ matrix.sdk }}-
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: release-ccache-${{ runner.os }}-${{ runner.arch }}-ios-${{ matrix.sdk }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-ccache-${{ runner.os }}-${{ runner.arch }}-ios-${{ matrix.sdk }}-
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-apple-ios-
      - name: Cache pinned Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ runner.workspace }}/swiftpm-cache/repositories
          key: swiftpm-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('product/Source/Platform/Apple/SSH/Package.resolved') }}
      - name: Build the device or simulator development app
        env:
          UBIQUITTY_SIGN_IDENTITY: ad-hoc
          UBQ_BUILD_JOBS: 4
        run: ./Scripts/build-ios.sh --sdk "${{ matrix.sdk }}"
      - name: Package without a TestFlight upload
        run: python3 "$UBQ_RELEASE_CI" ios --sdk "${{ matrix.sdk }}" --tag "$PRODUCT_TAG" --directory "$UBQ_BUILD_ROOT/dist"
      - name: Save QUIC dependencies
        if: always() && env.UBQ_BUILD_ROOT != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: |
            ${{ env.UBQ_BUILD_ROOT }}/quic-deps
            !${{ env.UBQ_BUILD_ROOT }}/quic-deps/**/src/*/build
          key: quic-apple-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.quic.outputs.quic_toolchain }}-${{ hashFiles('product/**/Scripts/fetch-quic-deps.sh', 'product/**/Scripts/macos-deployment-target.txt', 'product/**/Scripts/cmake/UbiquittyPreProject.cmake') }}-release-ios-${{ matrix.sdk }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save the compiler cache
        if: always() && env.CCACHE_DIR != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: release-ccache-${{ runner.os }}-${{ runner.arch }}-ios-${{ matrix.sdk }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-release-ios-${{ matrix.sdk }}
          path: ${{ env.UBQ_BUILD_ROOT }}/dist/*.tar.xz
          if-no-files-found: error

  source-packages:
    name: Source, wscons and editor packages
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          tag: ${{ env.PRODUCT_TAG }}
      - name: Validate notices and build the recursive source and editor archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Scripts/check-licenses.py --release
          python3 "$UBQ_RELEASE_CI" sources --tag "$PRODUCT_TAG" --directory "$UBQ_BUILD_ROOT/dist"
          python3 "$UBQ_RELEASE_CI" validate --tag "$PRODUCT_TAG" > "$UBQ_BUILD_ROOT/dist/composition.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-release-source-editors
          path: ${{ env.UBQ_BUILD_ROOT }}/dist/*
          if-no-files-found: error

  verify-ubq:
    name: Verify packaged CLI (${{ matrix.arch }})
    needs: [host-linux, release-ubq]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          tag: ${{ env.PRODUCT_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ubq-release-${{ matrix.arch }}
          path: ${{ runner.temp }}/ubq-client
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ubiquitty-host-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/ubq-host
      - name: Check version and MCP against the exact published host
        run: |
          binary="$RUNNER_TEMP/ubq-client/ubq-linux-${{ matrix.arch }}"
          host="$RUNNER_TEMP/ubq-host/ubiquitty-host-linux-${{ matrix.arch }}"
          chmod +x "$binary" "$host"
          python3 Scripts/check-ubq-release-version.py "$binary" "${PRODUCT_TAG#v}"
          UBQ_BIN="$binary" UBIQUITTY_HOST_BIN="$host" UBIQUITTY_HOME="$RUNNER_TEMP/ubq-mcp-home" \
            bash Libraries/ubiquitty-kit/Libraries/ubiquitty-core/Tests/Agent/mcp_smoke.sh

  prepare:
    name: Verify complete release preparation
    needs: [release, release-linux, release-ubq, verify-ubq, web, ios, source-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/prepared-inputs
      - name: Verify every platform and record its checksums
        working-directory: .
        run: |
          python3 Scripts/release_preparation.py collect --tag "$PRODUCT_TAG" \
            --inputs "$RUNNER_TEMP/prepared-inputs" --directory "$RUNNER_TEMP/release-preparation"
          python3 Scripts/release_preparation.py verify --tag "$PRODUCT_TAG" --directory "$RUNNER_TEMP/release-preparation"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preparation
          path: ${{ runner.temp }}/release-preparation/*
          if-no-files-found: error
          retention-days: 14
