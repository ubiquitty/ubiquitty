# Built-in themes — the single source of truth for Ubiquitty's bundled color
# schemes, parsed at startup by the same TOML reader as user [[themes]] blocks.
# Schema (matches user themes): name, is_dark, ansi[16], fg, bg, cursor.
# Attribution for the adapted upstream schemes is in theme-credits.md.

# Noir — the house default, resolved by NAME ("Noir"). Leads the list so it
# heads the View > Theme picker. A considered dark palette: a soft off-white on a
# deep near-black, accents at controlled chroma so each reads as its hue, real
# bright twins (8-15 are lighter, never grey except bright-black). Indices are
# purely cosmetic — nothing persists or defaults by position.
[[themes]]
name = "Noir"
is_dark = true
ansi = ["#2e323b", "#dd717a", "#98c896", "#e3be7c", "#72a3e8", "#c189d9", "#66c0c8", "#c8ccd4", "#5a606e", "#ea8088", "#a9d89f", "#efce8e", "#8ab5ee", "#d09fe5", "#7ccfd6", "#eaedf2"]
fg = "#c8ccd4"
bg = "#15171c"
cursor = "#e0e4ec"

# Noir Clair — the light half of the house pair, derived from Noir rather than
# picked by eye: every accent keeps Noir's hue and its absolute OKLCH chroma, and
# only lightness is re-solved so the palette sits at 5.5:1 (base) / 7:1 (bright)
# on the light ground — the same "reads as its hue, never shouts" band Noir holds
# against its dark one. The neutral ladder is the exact role mirror: the ground is
# a deep near-white on Noir's cool axis (never pure white, as Noir is never pure
# black), "white" sits just below it at 1.40 where Noir's "black" sits just above,
# and bright-white is the deepest ink as Noir's is the brightest. Bright twins are
# darker here, not lighter — the light-theme convention.
[[themes]]
name = "Noir Clair"
is_dark = false
ansi = ["#32363c", "#a7414c", "#416d40", "#7f5d17", "#3564a4", "#834d99", "#006e76", "#ccd2dd", "#8c93a2", "#93313e", "#345d2b", "#6b4f04", "#2e5587", "#6e4181", "#005d64", "#1c1f23"]
fg = "#32363c"
bg = "#f4f5f8"
cursor = "#22252b"

